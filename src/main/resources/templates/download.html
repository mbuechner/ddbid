<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
        <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
        <meta content="DDBid is a small and lightweight tool to record all DDB object IDs, compare it with previous ID dumps and show differences (new and missing items, persons and organizations)."
              name="description"/>
        <meta content="Michael Buechner" name="author"/>
        <title>DDBid</title>
        <link th:href="@{webjars/bootswatch-lux/5.3.3/bootstrap.min.css}" th:rel="stylesheet"/>
        <link th:href="@{css/custom.css}" th:rel="stylesheet"/>
        <script th:src="@{webjars/font-awesome/7.2.0/js/all.min.js}" data-auto-replace-svg="nest"></script>
    </head>
    <body th:data-download-catalog-url="@{/download/catalog}">
        <div th:replace="~{fragments/navbar.html}"></div>

        <main class="container-fluid py-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="h3 mb-1">Downloads</h1>
                    <div class="text-muted small" id="download-status">Loading...</div>
                </div>
                <button class="btn btn-outline-primary btn-sm" id="download-refresh" type="button" title="Refresh">
                    <i class="fas fa-rotate-right"></i>
                </button>
            </div>

            <div class="row g-4" id="download-groups"></div>
        </main>

        <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/js/download.js}"></script>
    </body>
</html>
