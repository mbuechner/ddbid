<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
        <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
        <meta content="DDBid is a small and lightweight tool to record all DDB object IDs, compare it with previous ID dumps and show differences (new and missing items, persons and organizations)."
              name="description"/>
        <meta content="Michael Buechner" name="author"/>
        <title>DDBid</title>
        <link th:href="@{webjars/bootswatch-lux/5.3.3/bootstrap.min.css}" th:rel="stylesheet"/>
        <link th:href="@{css/custom.css}" th:rel="stylesheet"/>
        <script th:src="@{webjars/font-awesome/7.2.0/js/all.min.js}" data-auto-replace-svg="nest"></script>
    </head>
    <body th:data-statistics-url="@{/statistics/data}">
        <div th:replace="~{fragments/navbar.html}"></div>

        <main class="container-fluid py-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="h3 mb-1">Statistics</h1>
                    <div class="text-muted small" id="statistics-status">Loading...</div>
                </div>
                <button class="btn btn-outline-primary btn-sm" id="statistics-refresh" type="button" title="Refresh">
                    <i class="fas fa-rotate-right"></i>
                </button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-tile">
                        <div class="stat-label">MISSING total</div>
                        <div class="stat-value" id="stat-missing-total">-</div>
                        <div class="stat-context" id="stat-missing-range">-</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-tile">
                        <div class="stat-label">NEW total</div>
                        <div class="stat-value" id="stat-new-total">-</div>
                        <div class="stat-context" id="stat-new-range">-</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-tile">
                        <div class="stat-label">MISSING latest</div>
                        <div class="stat-value" id="stat-missing-latest">-</div>
                        <div class="stat-context" id="stat-missing-latest-date">-</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-tile">
                        <div class="stat-label">NEW latest</div>
                        <div class="stat-value" id="stat-new-latest">-</div>
                        <div class="stat-context" id="stat-new-latest-date">-</div>
                    </div>
                </div>
            </div>

            <section class="statistics-section mb-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h2 class="h5 mb-0">Item status over time</h2>
                    <span class="badge text-bg-secondary" id="stat-point-count">0</span>
                </div>
                <div class="chart-frame chart-frame-large">
                    <canvas id="itemStatusTrend"></canvas>
                </div>
            </section>

            <div class="row g-4">
                <section class="col-12 col-xl-6">
                    <div class="statistics-section h-100">
                        <h2 class="h5 mb-3">Top provider</h2>
                        <div class="chart-frame">
                            <canvas id="missingByProvider"></canvas>
                        </div>
                        <div class="stat-list mt-3" id="missingByProviderList"></div>
                    </div>
                </section>
                <section class="col-12 col-xl-6">
                    <div class="statistics-section h-100">
                        <h2 class="h5 mb-3">Sectors</h2>
                        <div class="chart-frame">
                            <canvas id="missingBySector"></canvas>
                        </div>
                        <div class="stat-list mt-3" id="missingBySectorList"></div>

                        <div class="mt-4 mb-3">
                            <h3 class="h6 mb-0">Loss ratio (MISSING / total)</h3>
                        </div>
                        <div class="chart-frame">
                            <canvas id="missingBySectorRatio"></canvas>
                        </div>
                        <div class="stat-list mt-3" id="missingBySectorRatioList"></div>
                    </div>
                </section>
            </div>
        </main>

        <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/webjars/chart.js/4.5.1/dist/chart.umd.min.js}"></script>
        <script th:src="@{/js/palette.js}"></script>
        <script th:src="@{/js/ddbid-table.js}"></script>
        <script th:src="@{/js/statistics.js}"></script>
    </body>
</html>
