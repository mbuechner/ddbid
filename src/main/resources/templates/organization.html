<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
        <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
        <meta content="DDBid is a small and lightweight tool to record all DDB object IDs, compare it with previous ID dumps and show differences (new and missing items, persons and organizations)."
              name="description"/>
        <meta content="Michael Büchner" name="author"/>
        <title>DDBid</title>
        <link th:href="@{webjars/bootswatch-lux/5.3.3/bootstrap.min.css}" th:rel="stylesheet"/>
        <link th:href="@{css/custom.css}" th:rel="stylesheet"/>
        <link th:href="@{/webjars/datatables.net-bs5/2.3.7/css/dataTables.bootstrap5.min.css}" th:rel="stylesheet"/>
        <link th:href="@{/webjars/datatables.net-buttons-bs5/3.2.6/css/buttons.bootstrap5.min.css}" th:rel="stylesheet"/>
        <link th:href="@{/webjars/datatables.net-fixedheader-bs5/4.0.5/css/fixedHeader.bootstrap5.min.css}" th:rel="stylesheet"/>
        <link th:href="@{/webjars/datatables.net-columncontrol-dt/1.1.1/css/columnControl.dataTables.min.css}" th:rel="stylesheet"/>
        <script th:src="@{webjars/font-awesome/7.2.0/js/all.min.js}" data-auto-replace-svg="nest"></script>
    </head>
    <body>
        <!-- Navigation -->
        <div th:replace="~{fragments/navbar.html}"></div>
        <div class="container-fluid">
            <!-- Back to top button -->
            <button class="btn btn-primary btn-floating btn-sm" id="btn-back-to-top" type="button">
                <i class="fas fa-arrow-up text-light"></i>
            </button>
            <table class="table table-hover table-sm dt-responsive nowrap" id="ddbid" style="width: 100%">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Variant ID</th>
                        <th>Preferred Name</th>
                        <th>Type</th>
                    </tr>
                </thead>
            </table>
        </div>
        <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/webjars/jszip/3.10.1/dist/jszip.min.js}"></script>
        <script th:src="@{/webjars/datatables.net/2.3.7/js/dataTables.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-bs5/2.3.7/js/dataTables.bootstrap5.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-buttons/3.2.6/js/dataTables.buttons.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-buttons-bs5/3.2.6/js/buttons.bootstrap5.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-buttons/3.2.6/js/buttons.html5.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-fixedheader/4.0.5/js/dataTables.fixedHeader.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-fixedheader-bs5/4.0.5/js/fixedHeader.bootstrap5.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-columncontrol/1.1.1/js/dataTables.columnControl.min.js}"></script>
        <script th:src="@{/webjars/datatables.net-columncontrol-dt/1.1.1/js/columnControl.dataTables.min.js}"></script>
        <script th:src="@{js/ddbid-table.js}"></script>
        <script th:src="@{js/organization.js}"></script>
    </body>
</html>
