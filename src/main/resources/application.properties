ddbid.cron.objects=${DDBID_CRON_OBJECTS:0 0 6 * * FRI}
ddbid.cron.directmigration=${DDBID_CRON_DIRECTMIGRATION:0 0 4 * * FRI}
ddbid.cron.retry.delay=${DDBID_CRON_RETRY_DELAY:600000}
ddbid.cron.retry.max-attempts=${DDBID_CRON_RETRY_MAX_ATTEMPTS:${DDBID_CRON_RETRY_MAXATTEMPTS:5}}
scheduler.enabled=${SCHEDULER_ENABLED:true}
ddbid.database.table.item=item
ddbid.database.table.organization=organization
ddbid.database.table.person=person
ddbid.database.type=${DDBID_DATABASE_TYPE:h2}
ddbid.database=${DDBID_DATABASE:data/ddbid_DO_NOT_DELETE_ITS_IMPORTANT.db}
ddbid.database.url=${DDBID_DATABASE_URL:}
ddbid.database.user=${DDBID_DATABASE_USER:}
ddbid.database.password=${DDBID_DATABASE_PASSWORD:}
ddbid.database.indexes.auto=${DDBID_DATABASE_INDEXES_AUTO:false}
ddbid.statistics.cache.refresh-cron=${DDBID_STATISTICS_CACHE_REFRESH_CRON:0 15 2 * * *}
ddbid.dump.lockfile=${DDBID_DUMP_LOCKFILE:data/DUMP_IS_RUNNING.lock}
ddbid.datapath.item=${DDBID_DATAPATH_ITEM:data/dumps/item/}
ddbid.datapath.organization=${DDBID_DATAPATH_ORGANIZATION:data/dumps/organization/}
ddbid.datapath.person=${DDBID_DATAPATH_PERSON:data/dumps/person/}
ddbid.security.password=${DDBID_SECURITY_PASSWORD:password}
ddbid.security.user=${DDBID_SECURITY_USER:user}
ddbid.git.url=${DDBID_GIT_URL}
ddbid.git.branch=${DDBID_GIT_BRANCH:refs/heads/master}
ddbid.git.name=${DDBID_GIT_NAME:user}
ddbid.git.pass=${DDBID_GIT_PASS:password}
ddbid.apikey=${DDBID_APIKEY:}
springdotenv.enabled=true
springdotenv.ignore-if-missing=true
logging.level.de.ddb.labs.ddbid.service=${DDBID_SERVICE_LOG_LEVEL:INFO}
# logging.level.de.ddb.labs.ddbid.*=DEBUG
# logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
# logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
management.endpoint.shutdown.access=unrestricted
management.endpoints.web.exposure.include=health,shutdown
management.endpoint.health.probes.enabled=true
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.port=${DDBID_PORT:8080}
server.servlet.context-path=${DDBID_PATHPREFIX:/}
server.shutdown=graceful
server.tomcat.connection-timeout=3600
server.tomcat.max-connections=1000
server.tomcat.threads.max=10
spring.mvc.async.request-timeout=-1
